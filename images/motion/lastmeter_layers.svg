<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>One last meter answer, layer by layer: building, parking, entrance, walk path, approach from the waypoint and the optional reference point, each with the property that draws it</title>
  <defs>
    <clipPath id="mapclip"><rect x="20" y="20" width="420" height="290" rx="10"/></clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="860" height="330" rx="14" fill="#FAFAF8"/>

  <!-- Map -->
  <g clip-path="url(#mapclip)">
    <rect x="20" y="20" width="420" height="290" fill="#F3F0E8"/>
    <rect x="100" y="36" width="110" height="74" rx="2" fill="#E2DDD2"/>
    <rect x="380" y="36" width="70" height="110" rx="2" fill="#E2DDD2"/>
    <rect x="360" y="172" width="90" height="62" rx="2" fill="#E2DDD2"/>
    <rect x="110" y="128" width="70" height="58" rx="2" fill="#E2DDD2"/>
    <rect x="140" y="206" width="52" height="46" rx="3" fill="#E9E4D8"/>
    <path d="M20,262 H440 M80,20 V262" stroke="#CFC7B8" stroke-width="24" fill="none"/>
    <path d="M20,262 H440 M80,20 V262" stroke="#FFFFFF" stroke-width="20" fill="none"/>

    <!-- 1 building -->
    <g opacity="1">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0429;0.0714;0.8857;0.9429;1" dur="14s" repeatCount="indefinite"/>
      <path d="M232,80 H340 V150 H300 V200 H232 Z" fill="#1E9ED5" fill-opacity="0.18" stroke="#1E9ED5" stroke-width="1.5"/>
    </g>
    <!-- 5 approach (under the markers) -->
    <g opacity="1">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3857;0.4143;0.8857;0.9429;1" dur="14s" repeatCount="indefinite"/>
      <path d="M110,262 H148 Q166,262 166,244 V224" fill="none" stroke="#1E9ED5" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- 4 walk path -->
    <g opacity="1">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.3286;0.8857;0.9429;1" dur="14s" repeatCount="indefinite"/>
      <path d="M166,222 Q192,216 206,200 T232,182" fill="none" stroke="#1E9ED5" stroke-opacity="0.6" stroke-width="3.5" stroke-dasharray="6 5" stroke-linecap="round"/>
    </g>
    <!-- 6 waypoint -->
    <g opacity="1" filter="url(#shadow)">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4714;0.5;0.8857;0.9429;1" dur="14s" repeatCount="indefinite"/>
      <g transform="translate(110,262)"><circle r="9" fill="#1E9ED5"/><text y="3.8" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">W</text></g>
    </g>
    <!-- 2 parking -->
    <g opacity="1" filter="url(#shadow)">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1286;0.1571;0.8857;0.9429;1" dur="14s" repeatCount="indefinite"/>
      <g transform="translate(166,222)"><rect x="-11" y="-11" width="22" height="22" rx="4" fill="#1E9ED5"/><text y="5" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">P</text></g>
    </g>
    <!-- 3 entrance -->
    <g opacity="1" filter="url(#shadow)">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2143;0.2429;0.8857;0.9429;1" dur="14s" repeatCount="indefinite"/>
      <g transform="translate(232,182)"><circle r="11" fill="#E63946"/><text y="4.5" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">E</text></g>
    </g>
    <!-- 7 taskpoint -->
    <g opacity="1">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5571;0.5857;0.8857;0.9429;1" dur="14s" repeatCount="indefinite"/>
      <circle cx="272" cy="216" r="5" fill="#E63946" stroke="#FFFFFF" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Layer list -->
  <text x="470" y="34" font-size="11.5" fill="#757575">each layer and the property that draws it</text>
  <g font-size="13" font-weight="600" fill="#303334">
    <g opacity="1">
      <animate attributeName="opacity" values="0.3;0.3;1;1;0.3;0.3" keyTimes="0;0.0429;0.0714;0.8857;0.9429;1" dur="14s" repeatCount="indefinite"/>
      <rect x="470" y="51" width="18" height="14" rx="2" fill="#1E9ED5" fill-opacity="0.18" stroke="#1E9ED5" stroke-width="1.5"/>
      <text x="500" y="62">Building</text>
      <text x="500" y="78" font-size="11" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#00636E">point_type: building (polygon)</text>
    </g>
    <g opacity="1">
      <animate attributeName="opacity" values="0.3;0.3;1;1;0.3;0.3" keyTimes="0;0.1286;0.1571;0.8857;0.9429;1" dur="14s" repeatCount="indefinite"/>
      <g transform="translate(479,96)"><rect x="-8" y="-8" width="16" height="16" rx="3" fill="#1E9ED5"/><text y="4" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">P</text></g>
      <text x="500" y="100">Parking</text>
      <text x="500" y="116" font-size="11" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#00636E">point_type: parking</text>
    </g>
    <g opacity="1">
      <animate attributeName="opacity" values="0.3;0.3;1;1;0.3;0.3" keyTimes="0;0.2143;0.2429;0.8857;0.9429;1" dur="14s" repeatCount="indefinite"/>
      <g transform="translate(479,134)"><circle r="8" fill="#E63946"/><text y="3.8" text-anchor="middle" font-size="9.5" font-weight="700" fill="#FFFFFF">E</text></g>
      <text x="500" y="138">Entrance</text>
      <text x="500" y="154" font-size="11" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#00636E">point_type: entrance</text>
    </g>
    <g opacity="1">
      <animate attributeName="opacity" values="0.3;0.3;1;1;0.3;0.3" keyTimes="0;0.3;0.3286;0.8857;0.9429;1" dur="14s" repeatCount="indefinite"/>
      <path d="M470,172 H488" stroke="#1E9ED5" stroke-opacity="0.6" stroke-width="3" stroke-dasharray="4 3" stroke-linecap="round"/>
      <text x="500" y="176">Walk path</text>
      <text x="500" y="192" font-size="11" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#00636E">line_type: parking_to_entrance</text>
    </g>
    <g opacity="1">
      <animate attributeName="opacity" values="0.3;0.3;1;1;0.3;0.3" keyTimes="0;0.3857;0.4143;0.8857;0.9429;1" dur="14s" repeatCount="indefinite"/>
      <path d="M470,210 H488" stroke="#1E9ED5" stroke-width="3" stroke-linecap="round"/>
      <text x="500" y="214">Approach, driven</text>
      <text x="500" y="230" font-size="11" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#00636E">line_type: waypoint_to_parking</text>
    </g>
    <g opacity="1">
      <animate attributeName="opacity" values="0.3;0.3;1;1;0.3;0.3" keyTimes="0;0.4714;0.5;0.8857;0.9429;1" dur="14s" repeatCount="indefinite"/>
      <g transform="translate(479,248)"><circle r="7" fill="#1E9ED5"/><text y="3.3" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FFFFFF">W</text></g>
      <text x="500" y="252">Waypoint</text>
      <text x="500" y="268" font-size="11" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#00636E">point_type: waypoint · waypoint_style: marker</text>
    </g>
    <g opacity="1">
      <animate attributeName="opacity" values="0.3;0.3;1;1;0.3;0.3" keyTimes="0;0.5571;0.5857;0.8857;0.9429;1" dur="14s" repeatCount="indefinite"/>
      <circle cx="479" cy="286" r="5" fill="#E63946" stroke="#FFFFFF" stroke-width="1.5"/>
      <text x="500" y="290">Reference <tspan font-weight="400" fill="#757575">(optional)</tspan></text>
      <text x="500" y="306" font-size="11" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#00636E">point_type: taskpoint · reference=true</text>
    </g>
  </g>
</svg>
