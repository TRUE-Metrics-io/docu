<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="1000" height="390" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>One stop from parking to driving off: picking, outdoor to customer, indoor, outdoor from customer and buffer fill up in order, then t_search, service time and t_total are marked</title>

  <rect width="1000" height="390" rx="14" fill="#FAFAF8"/>

  <text x="60" y="36" font-size="15" font-weight="700" fill="#303334">One stop, from parking to driving off</text>
  <text x="60" y="56" font-size="12" fill="#757575">Each duration runs between two steps of the stop's <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#00636E">states</tspan> (codes under the labels). All times in seconds.</text>

  <!-- Steps -->
  <g font-size="11.5" fill="#303334" text-anchor="middle">
    <text x="60" y="88">Parks</text>
    <text x="190" y="88">Leaves vehicle</text>
    <text x="400" y="88">Enters building</text>
    <text x="600" y="88">Back outside</text>
    <text x="770" y="88">Back at vehicle</text>
    <text x="920" y="88">Drives off</text>
  </g>
  <g font-size="11" font-weight="700" fill="#00636E" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
    <text x="60" y="104">S</text>
    <text x="190" y="104">C</text>
    <text x="400" y="104">E</text>
    <text x="600" y="104">B</text>
    <text x="770" y="104">S2</text>
    <text x="920" y="104">F</text>
  </g>
  <path d="M60,110 V178 M190,110 V178 M400,110 V178 M600,110 V178 M770,110 V178 M920,110 V178" stroke="#CFD8DC" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Segment names -->
  <g font-size="12" font-weight="600" fill="#303334" text-anchor="middle">
    <text x="125" y="142">Picking</text>
    <text x="295" y="142">Outdoor to customer</text>
    <text x="500" y="142">Indoor</text>
    <text x="685" y="142">Outdoor from customer</text>
    <text x="845" y="142">Buffer</text>
  </g>

  <!-- Bar, dimmed -->
  <g opacity="0.25">
    <rect x="60" y="150" width="130" height="22" fill="#90A4AE"/>
    <rect x="190" y="150" width="210" height="22" fill="#4FB3D9"/>
    <rect x="400" y="150" width="200" height="22" fill="#0097a7"/>
    <rect x="600" y="150" width="170" height="22" fill="#4FB3D9"/>
    <rect x="770" y="150" width="150" height="22" fill="#90A4AE"/>
  </g>

  <!-- Bar, filling up as the stop goes on -->
  <g>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.9;0.97;1" dur="12s" repeatCount="indefinite"/>
    <rect x="60" y="150" width="130" height="22" fill="#90A4AE">
      <animate attributeName="width" values="0;0;130;130" keyTimes="0;0.05;0.156;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <rect x="190" y="150" width="210" height="22" fill="#4FB3D9">
      <animate attributeName="width" values="0;0;210;210" keyTimes="0;0.156;0.327;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <rect x="400" y="150" width="200" height="22" fill="#0097a7">
      <animate attributeName="width" values="0;0;200;200" keyTimes="0;0.327;0.49;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <rect x="600" y="150" width="170" height="22" fill="#4FB3D9">
      <animate attributeName="width" values="0;0;170;170" keyTimes="0;0.49;0.628;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <rect x="770" y="150" width="150" height="22" fill="#90A4AE">
      <animate attributeName="width" values="0;0;150;150" keyTimes="0;0.628;0.75;1" dur="12s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Parking at both ends -->
  <g transform="translate(60,161)"><rect x="-10" y="-10" width="20" height="20" rx="4" fill="#1E9ED5"/><text y="4.5" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">P</text></g>
  <g transform="translate(920,161)"><rect x="-10" y="-10" width="20" height="20" rx="4" fill="#1E9ED5"/><text y="4.5" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">P</text></g>

  <!-- Courier -->
  <circle cx="60" cy="161" r="7" fill="#F0A04B" stroke="#FFFFFF" stroke-width="2" opacity="0">
    <animate attributeName="cx" values="60;60;920;920" keyTimes="0;0.05;0.75;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.8;0.86;1" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- Column names -->
  <g font-size="10.5" fill="#00636E" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
    <text x="125" y="192">t_picking</text>
    <text x="295" y="192">t_outdoor_to_customer</text>
    <text x="500" y="192">t_indoor</text>
    <text x="685" y="192">t_outdoor_from_customer</text>
    <text x="845" y="192">t_buffer</text>
  </g>

  <!-- t_search -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.327;0.35;0.9;0.97;1" dur="12s" repeatCount="indefinite"/>
    <rect x="190" y="204" width="170" height="16" fill="none" stroke="#4FB3D9" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="275" y="216" text-anchor="middle" font-size="10" fill="#2B7FA3">as long as the way back</text>
    <rect x="360" y="204" width="40" height="16" fill="#E8897A"/>
    <text x="412" y="216" font-size="10.5" fill="#C0583F" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">t_search = t_outdoor_to_customer − t_outdoor_from_customer</text>
    <text x="412" y="233" font-size="11" fill="#757575">how much longer the way in took than the way back</text>
  </g>

  <!-- Service time -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.628;0.65;0.9;0.97;1" dur="12s" repeatCount="indefinite"/>
    <path d="M190,254 v8 h580 v-8" fill="none" stroke="#0097a7" stroke-width="2"/>
    <text x="480" y="282" text-anchor="middle" font-size="11.5" fill="#303334">Service time = <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#00636E">t_outdoor_to_customer + t_indoor + t_outdoor_from_customer</tspan> (no column)</text>
  </g>

  <!-- t_total -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.75;0.77;0.9;0.97;1" dur="12s" repeatCount="indefinite"/>
    <path d="M60,302 v8 h860 v-8" fill="none" stroke="#303334" stroke-width="2"/>
    <text x="490" y="330" text-anchor="middle" font-size="11.5" fill="#303334"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#00636E" font-weight="700">t_total</tspan>: the whole stop, from parking to driving off (the five durations added up)</text>
  </g>

  <text x="60" y="368" font-size="12" fill="#757575">Without a detected entrance (no <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#00636E">E</tspan>): <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#00636E">t_indoor</tspan> is 0, the time from C to S2 is split evenly between the two outdoor times, and <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#00636E">t_search</tspan> is empty.</text>
</svg>
