<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>SDK lifecycle over a courier's day: init after login, Initializing then Initialized, startRecording at route start, RecordingInProgress, stopRecording at route end, deinitialize at logout; the SDK's notification is visible from init to deinitialize</title>
  <defs>
    <clipPath id="reveal">
      <rect x="0" y="0" width="1000" height="400">
        <animate attributeName="width" values="150;1000;1000" keyTimes="0;0.8;1" dur="13s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1000" height="400" rx="14" fill="#FAFAF8"/>
  <text x="40" y="40" font-size="15" font-weight="700" fill="#303334">Recommended lifecycle over a courier's day</text>

  <!-- Lane labels -->
  <g font-size="12" font-weight="600" fill="#303334">
    <text x="40" y="94">Your app</text>
    <text x="40" y="144">SDK call</text>
    <text x="40" y="204">Status</text>
    <text x="40" y="264">Recording</text>
    <text x="40" y="324">Notification</text>
  </g>

  <g clip-path="url(#reveal)">
    <!-- Call markers -->
    <g stroke="#9E9E9E" stroke-width="1.5" stroke-dasharray="3 4">
      <path d="M160,104 V340"/><path d="M340,104 V340"/><path d="M760,104 V340"/><path d="M890,104 V340"/>
    </g>

    <!-- App events -->
    <g font-size="11.5" fill="#616161" text-anchor="middle">
      <text x="160" y="94">Login</text>
      <text x="340" y="94">Route start</text>
      <text x="550" y="94">Deliveries</text>
      <text x="760" y="94">Route end</text>
      <text x="890" y="94">Logout</text>
    </g>

    <!-- SDK calls -->
    <g font-size="11.5" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
      <rect x="120" y="128" width="80" height="24" rx="12" fill="#0097a7"/>
      <text x="160" y="144" fill="#FFFFFF">init()</text>
      <rect x="276" y="128" width="128" height="24" rx="12" fill="#0097a7"/>
      <text x="340" y="144" fill="#FFFFFF">startRecording()</text>
      <g fill="#E63946">
        <circle cx="440" cy="140" r="5"/><circle cx="490" cy="140" r="5"/><circle cx="545" cy="140" r="5"/>
        <circle cx="600" cy="140" r="5"/><circle cx="650" cy="140" r="5"/><circle cx="705" cy="140" r="5"/>
      </g>
      <text x="572" y="122" fill="#E63946" font-size="10.5">logMetadata()</text>
      <rect x="700" y="152" width="120" height="24" rx="12" fill="#0097a7"/>
      <text x="760" y="168" fill="#FFFFFF">stopRecording()</text>
      <rect x="836" y="128" width="108" height="24" rx="12" fill="#0097a7"/>
      <text x="890" y="144" fill="#FFFFFF">deinitialize()</text>
    </g>

    <!-- Status -->
    <g font-size="10.5" font-weight="600" text-anchor="middle">
      <rect x="100" y="188" width="60" height="26" fill="#ECEAE4"/>
      <rect x="160" y="188" width="70" height="26" fill="#E0F4F6"/>
      <text x="195" y="205" fill="#00636E">Initializing</text>
      <rect x="230" y="188" width="110" height="26" fill="#B2DFE4"/>
      <text x="285" y="205" fill="#00636E">Initialized</text>
      <rect x="340" y="188" width="420" height="26" fill="#0097a7"/>
      <text x="550" y="205" fill="#FFFFFF">RecordingInProgress</text>
      <rect x="760" y="188" width="130" height="26" fill="#B2DFE4"/>
      <text x="825" y="205" fill="#00636E">RecordingStopped</text>
      <rect x="890" y="188" width="60" height="26" fill="#ECEAE4"/>
      <text x="130" y="205" fill="#9E9E9E" font-weight="400">Uninit.</text>
      <text x="920" y="205" fill="#9E9E9E" font-weight="400">Uninit.</text>
    </g>

    <!-- Recording -->
    <rect x="340" y="250" width="420" height="20" rx="10" fill="#0097a7"/>
    <text x="550" y="264" text-anchor="middle" font-size="11" fill="#FFFFFF">sensor data recorded and uploaded</text>

    <!-- Notification: init to deinitialize -->
    <rect x="160" y="310" width="730" height="20" rx="10" fill="#F0A04B"/>
    <text x="525" y="324" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">SDK notification visible, also while not recording</text>
  </g>

  <!-- Clock cursor; hidden in the still frame -->
  <g opacity="0">
    <path d="M0,80 V344" stroke="#303334" stroke-width="1.5"/>
    <animateTransform attributeName="transform" type="translate" values="150,0;1000,0;1000,0" keyTimes="0;0.8;1" dur="13s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.78;0.8;1" dur="13s" repeatCount="indefinite"/>
  </g>

  <text x="40" y="374" font-size="11.5" fill="#616161">A started recording resumes on the next init() after a crash, an OS kill or an update. Never stop it from lifecycle callbacks.</text>
</svg>
