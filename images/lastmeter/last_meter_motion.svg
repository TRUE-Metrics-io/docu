<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>The last meter: route to the waypoint, into the parking, walk to the entrance</title>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Map -->
  <rect width="800" height="440" rx="14" fill="#F3F0E8"/>
  <!-- Blocks -->
  <rect x="40" y="60" width="170" height="200" rx="4" fill="#E2DDD2"/>
  <rect x="610" y="60" width="160" height="200" rx="4" fill="#E2DDD2"/>
  <rect x="60" y="80" width="60" height="70" rx="2" fill="#D3CDBF"/>
  <rect x="130" y="80" width="60" height="90" rx="2" fill="#D3CDBF"/>
  <rect x="630" y="80" width="120" height="60" rx="2" fill="#D3CDBF"/>
  <rect x="630" y="160" width="55" height="80" rx="2" fill="#D3CDBF"/>
  <rect x="40" y="370" width="300" height="50" rx="4" fill="#E2DDD2"/>
  <rect x="420" y="370" width="350" height="50" rx="4" fill="#E2DDD2"/>
  <!-- Courtyard -->
  <rect x="230" y="60" width="360" height="215" rx="6" fill="#E9F0E1"/>

  <!-- Main road and driveway -->
  <path d="M0,320 H800" stroke="#CFC7B8" stroke-width="34"/>
  <path d="M0,320 H800" stroke="#FFFFFF" stroke-width="30"/>
  <path d="M500,320 V196" stroke="#CFC7B8" stroke-width="18" stroke-linecap="round"/>
  <path d="M500,320 V196" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
  <rect x="490" y="150" width="80" height="60" rx="6" fill="#FFFFFF" stroke="#CFC7B8" stroke-width="2"/>
  <text x="400" y="352" text-anchor="middle" font-size="11" fill="#9A9183" letter-spacing="2">MAIN STREET</text>

  <!-- Target building -->
  <rect x="270" y="95" width="150" height="150" rx="3" fill="#1E9ED5" fill-opacity="0.18" stroke="#1E9ED5" stroke-width="2"/>
  <text x="345" y="175" text-anchor="middle" font-size="12" fill="#0B4F7C" font-weight="600">Building</text>

  <!-- Route to the waypoint -->
  <path d="M-10,320 H500" stroke="#0B4F7C" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
  <!-- Waypoint to parking -->
  <path d="M500,320 V210 L518,200" fill="none" stroke="#1E9ED5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Walk path parking to entrance -->
  <path d="M518,196 L470,170 L422,160" fill="none" stroke="#1E9ED5" stroke-width="4" stroke-dasharray="7 6" stroke-linecap="round" opacity="0.85">
    <animate attributeName="stroke-dashoffset" from="26" to="0" dur="1.2s" repeatCount="indefinite"/>
  </path>

  <!-- Generic address pin (where address-based navigation stops) -->
  <g transform="translate(345,288)" opacity="0.85">
    <path d="M0,0 C-12,-14 -12,-30 0,-30 C12,-30 12,-14 0,0 Z" fill="#9E9E9E"/>
    <circle cx="0" cy="-20" r="4.5" fill="#FFFFFF"/>
  </g>
  <g transform="translate(250,392)">
    <rect x="-118" y="-15" width="236" height="26" rx="13" fill="#FFFFFF" stroke="#BDBDBD"/>
    <circle cx="-100" cy="-2" r="5" fill="#9E9E9E"/>
    <text x="-88" y="2" font-size="11.5" fill="#616161">Address pin: generic navigation stops</text>
  </g>

  <!-- Waypoint -->
  <circle cx="500" cy="320" r="8" fill="#FFFFFF" stroke="#1E9ED5" stroke-width="4"/>
  <text x="514" y="345" font-size="12" fill="#0B4F7C" font-weight="600">Waypoint</text>

  <!-- Parking -->
  <g transform="translate(552,176)" filter="url(#shadow)">
    <rect x="-13" y="-13" width="26" height="26" rx="6" fill="#1E9ED5"/>
    <text x="0" y="5" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">P</text>
  </g>
  <text x="572" y="181" font-size="12" fill="#0B4F7C" font-weight="600">Parking</text>

  <!-- Entrance -->
  <g transform="translate(422,160)">
    <circle r="16" fill="#E63946" opacity="0.25">
      <animate attributeName="r" values="11;11;11;24;11" keyTimes="0;0.8;0.82;0.92;1" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.5;0;0" keyTimes="0;0.8;0.82;0.92;1" dur="14s" repeatCount="indefinite"/>
    </circle>
    <g filter="url(#shadow)">
      <circle r="12" fill="#E63946"/>
      <text x="0" y="5" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">E</text>
    </g>
  </g>
  <text x="404" y="140" text-anchor="end" font-size="12" fill="#B3261E" font-weight="600">Entrance</text>

  <!-- Van -->
  <g>
    <animateMotion path="M-30,320 L500,320 L500,210 L518,200" keyPoints="0;0.802;1;1" keyTimes="0;0.40;0.55;1" calcMode="linear" rotate="auto" dur="14s" repeatCount="indefinite"/>
    <g filter="url(#shadow)">
      <rect x="-15" y="-9" width="30" height="18" rx="4" fill="#F0A04B" stroke="#FFFFFF" stroke-width="2"/>
      <rect x="6" y="-7" width="7" height="14" rx="2" fill="#FFFFFF" opacity="0.7"/>
    </g>
  </g>

  <!-- Courier on foot -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.56;0.58;0.97;1" dur="14s" repeatCount="indefinite"/>
    <animateMotion path="M518,196 L470,170 L428,161" keyPoints="0;0;1;1" keyTimes="0;0.58;0.80;1" calcMode="linear" dur="14s" repeatCount="indefinite"/>
    <circle r="7" fill="#303334" stroke="#FFFFFF" stroke-width="2.5" filter="url(#shadow)"/>
  </g>

  <!-- Phase captions -->
  <g font-size="15" font-weight="600" fill="#303334">
    <rect x="20" y="16" width="420" height="34" rx="17" fill="#FFFFFF" filter="url(#shadow)"/>
    <text x="40" y="38" opacity="0">1 · Route along the street to the waypoint
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.39;0.40;1" dur="14s" repeatCount="indefinite"/>
    </text>
    <text x="40" y="38" opacity="0">2 · Into the parking the couriers really use
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.399;0.40;0.57;0.571;1" dur="14s" repeatCount="indefinite"/>
    </text>
    <text x="40" y="38" opacity="0">3 · Walk to the entrance that is really used
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.569;0.57;0.81;0.811;1" dur="14s" repeatCount="indefinite"/>
    </text>
    <text x="40" y="38" opacity="0" fill="#2E7D32">✓ At the door, no searching
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.809;0.81;1" dur="14s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Legend -->
  <g transform="translate(560,26)" font-size="11.5" fill="#303334">
    <rect x="-12" y="-14" width="222" height="96" rx="10" fill="#FFFFFF" fill-opacity="0.92" stroke="#E0DAD0"/>
    <path d="M0,0 H26" stroke="#0B4F7C" stroke-width="6" stroke-linecap="round"/><text x="36" y="4">Route (routing on)</text>
    <path d="M0,22 H26" stroke="#1E9ED5" stroke-width="4" stroke-linecap="round"/><text x="36" y="26">Waypoint → parking</text>
    <path d="M0,44 H26" stroke="#1E9ED5" stroke-width="3.5" stroke-dasharray="6 5" stroke-linecap="round"/><text x="36" y="48">Walk path parking → entrance</text>
    <rect x="0" y="58" width="26" height="14" rx="2" fill="#1E9ED5" fill-opacity="0.2" stroke="#1E9ED5" stroke-width="1.5"/><text x="36" y="70">Building of the entrance</text>
  </g>
</svg>
