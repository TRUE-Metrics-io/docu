<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Ways to bring the truemetrics last meter to couriers</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#757575"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="960" height="620" rx="14" fill="#FAFAF8"/>

  <!-- Legend -->
  <g font-size="12" fill="#424242" transform="translate(30,40)">
    <rect x="0" y="-11" width="22" height="14" rx="3" fill="#E0F4F6" stroke="#0097a7" stroke-width="1.5"/>
    <text x="30" y="0">provided by truemetrics</text>
    <rect x="180" y="-11" width="22" height="14" rx="3" fill="#FFFFFF" stroke="#9E9E9E" stroke-width="1.5"/>
    <text x="210" y="0">built and run by you</text>
  </g>

  <!-- Option groups -->
  <rect x="240" y="66" width="700" height="182" rx="12" fill="#F1F1EE"/>
  <text x="350" y="88" font-size="13" font-weight="700" fill="#616161" letter-spacing="0.5">OPTION 1 · LAST METER IN YOUR OWN MAP</text>
  <rect x="240" y="262" width="700" height="200" rx="12" fill="#EAF6F7"/>
  <text x="350" y="284" font-size="13" font-weight="700" fill="#00737F" letter-spacing="0.5">OPTION 2 · TRUEMETRICS LAST METER MODULE IN YOUR APP</text>
  <rect x="240" y="474" width="700" height="128" rx="12" fill="#EAF6F7"/>
  <text x="350" y="496" font-size="13" font-weight="700" fill="#00737F" letter-spacing="0.5">OPTION 3 · TRUEMETRICS STANDALONE NAVIGATION APP</text>

  <!-- Connectors (dots travel under the boxes) -->
  <g fill="none" stroke="#BDBDBD" stroke-width="2.5">
    <path id="c1a" d="M210,300 C255,300 255,130 300,130 H650"/>
    <path id="c1b" d="M210,300 C255,300 255,210 300,210 H650"/>
    <path id="c2a" d="M210,300 C255,300 255,372 300,372 H340 C400,372 400,330 460,330 H470"/>
    <path id="c2b" d="M210,300 C255,300 255,372 300,372 H340 C400,372 400,415 460,415 H470"/>
    <path id="c2c" d="M210,300 C255,300 255,550 300,550 H470"/>
  </g>
  <g fill="#00636E">
    <circle r="5"><animateMotion dur="3.2s" repeatCount="indefinite" begin="0s"><mpath href="#c1a"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="3.2s" repeatCount="indefinite" begin="1.6s"><mpath href="#c1a"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="2.4s" repeatCount="indefinite" begin="0.4s"><mpath href="#c1b"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="2.4s" repeatCount="indefinite" begin="1.6s"><mpath href="#c1b"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="1.8s" repeatCount="indefinite" begin="0.2s"><mpath href="#c2a"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="1.8s" repeatCount="indefinite" begin="0.8s"><mpath href="#c2b"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="1.8s" repeatCount="indefinite" begin="1.3s"><mpath href="#c2c"/></animateMotion></circle>
  </g>

  <!-- truemetrics source -->
  <g filter="url(#shadow)">
    <rect x="24" y="260" width="186" height="80" rx="14" fill="#E0F4F6" stroke="#0097a7" stroke-width="2"/>
  </g>
  <text x="117" y="306" text-anchor="middle" font-size="18" font-weight="700" fill="#1A1A1A">truemetrics data</text>

  <!-- Row badges -->
  <g font-size="12" font-weight="700" text-anchor="middle">
    <circle cx="320" cy="130" r="15" fill="#616161"/><text x="320" y="134.5" fill="#FFFFFF">1A</text>
    <circle cx="320" cy="210" r="15" fill="#616161"/><text x="320" y="214.5" fill="#FFFFFF">1B</text>
    <circle cx="320" cy="372" r="15" fill="#00636E"/><text x="320" y="376.5" fill="#FFFFFF">2</text>
    <circle cx="320" cy="550" r="15" fill="#00636E"/><text x="320" y="554.5" fill="#FFFFFF">3</text>
  </g>

  <!-- 1A: export to your backend -->
  <g>
    <rect x="352" y="118" width="102" height="24" rx="12" fill="#FFFFFF" stroke="#BDBDBD"/>
    <text x="403" y="134" text-anchor="middle" font-size="11.5" fill="#424242">daily export</text>
    <rect x="470" y="108" width="128" height="44" rx="8" fill="#FFFFFF" stroke="#9E9E9E" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="534" y="127" text-anchor="middle" font-size="13" font-weight="600" fill="#303334">Your backend</text>
    <text x="534" y="143" text-anchor="middle" font-size="11" fill="#757575">S3 · GCS · SFTP</text>
    <rect x="650" y="102" width="270" height="56" rx="10" fill="#FFFFFF" stroke="#9E9E9E" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="666" y="125" font-size="13.5" font-weight="600" fill="#303334">Your courier app</text>
    <text x="666" y="144" font-size="11.5" fill="#757575">your map draws P · E · walk path</text>
  </g>

  <!-- 1B: REST API -->
  <g>
    <rect x="410" y="198" width="180" height="24" rx="12" fill="#E0F4F6" stroke="#0097a7"/>
    <text x="500" y="214" text-anchor="middle" font-size="11.5" fill="#00636E">REST API · GeoJSON or PNG</text>
    <rect x="650" y="182" width="270" height="56" rx="10" fill="#FFFFFF" stroke="#9E9E9E" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="666" y="205" font-size="13.5" font-weight="600" fill="#303334">Your courier app</text>
    <text x="666" y="224" font-size="11.5" fill="#757575">your map draws the ready-styled layers</text>
  </g>

  <!-- 2: module, point-to-point navigation off -->
  <g>
    <rect x="470" y="300" width="450" height="60" rx="10" fill="#FFFFFF" stroke="#9E9E9E" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="486" y="326" font-size="13.5" font-weight="600" fill="#303334">Your courier app</text>
    <text x="486" y="344" font-size="11" font-weight="700" fill="#00737F">navigation off</text>
    <rect x="618" y="308" width="292" height="44" rx="8" fill="#E0F4F6" stroke="#0097a7" stroke-width="1.5"/>
    <text x="634" y="327" font-size="13" font-weight="600" fill="#00636E">truemetrics module</text>
    <text x="634" y="344" font-size="11.5" fill="#00737F">last meter view, no route</text>
    <g transform="translate(860,330)">
      <rect x="-28" y="-9" width="18" height="18" rx="4" fill="#1E9ED5"/><text x="-19" y="4.5" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">P</text>
      <path d="M-8,0 H8" stroke="#1E9ED5" stroke-width="2.5" stroke-dasharray="3 3"/>
      <circle cx="19" cy="0" r="9" fill="#E63946"/><text x="19" y="4.5" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">E</text>
    </g>
  </g>

  <!-- 2: module, point-to-point navigation on -->
  <g>
    <rect x="470" y="385" width="450" height="60" rx="10" fill="#FFFFFF" stroke="#9E9E9E" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="486" y="411" font-size="13.5" font-weight="600" fill="#303334">Your courier app</text>
    <text x="486" y="429" font-size="11" font-weight="700" fill="#00737F">navigation on</text>
    <rect x="618" y="393" width="292" height="44" rx="8" fill="#E0F4F6" stroke="#0097a7" stroke-width="1.5"/>
    <text x="634" y="412" font-size="13" font-weight="600" fill="#00636E">truemetrics module</text>
    <text x="634" y="429" font-size="11.5" fill="#00737F">route + turn-by-turn + last meter</text>
    <g transform="translate(860,415)">
      <path d="M-34,8 C-20,8 -20,-6 -6,-6" fill="none" stroke="#0B4F7C" stroke-width="4" stroke-linecap="round"/>
      <rect x="-6" y="-15" width="18" height="18" rx="4" fill="#1E9ED5"/><text x="3" y="-1.5" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">P</text>
      <circle cx="28" cy="2" r="9" fill="#E63946"/><text x="28" y="6.5" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">E</text>
    </g>
  </g>

  <!-- 3: standalone app with app switch -->
  <g>
    <rect x="470" y="520" width="196" height="60" rx="10" fill="#E0F4F6" stroke="#0097a7" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="486" y="545" font-size="13" font-weight="600" fill="#00636E">truemetrics navigation app</text>
    <text x="486" y="564" font-size="11.5" fill="#00737F">instead of Google Maps / Waze</text>
    <path d="M674,542 H722" stroke="#757575" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M722,560 H674" stroke="#757575" stroke-width="2" marker-end="url(#arrow)"/>
    <circle r="4.5" fill="#F0A04B">
      <animate attributeName="cx" values="680;716;716;680;680" keyTimes="0;0.35;0.5;0.85;1" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="542;542;560;560;542" keyTimes="0;0.35;0.5;0.85;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="698" y="590" text-anchor="middle" font-size="11" fill="#616161">app switch</text>
    <rect x="730" y="520" width="190" height="60" rx="10" fill="#FFFFFF" stroke="#9E9E9E" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="746" y="545" font-size="13.5" font-weight="600" fill="#303334">Your courier app</text>
    <text x="746" y="564" font-size="11.5" fill="#757575">hands over the stop, as today</text>
  </g>
</svg>
